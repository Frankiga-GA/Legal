<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#E5B942" />
      <stop offset="70%" stop-color="#C99424" />
      <stop offset="100%" stop-color="#91640D" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark luxury rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Scales of Justice (LUSTI Legal Icon) -->
  <g fill="url(#goldGrad)" stroke="url(#goldGrad)" filter="url(#glow)">
    <!-- Top finial / spire -->
    <polygon points="32,9 34.5,14 29.5,14" stroke-width="0" />
    
    <!-- Central Pillar -->
    <rect x="30.5" y="14" width="3" height="34" rx="1.5" stroke-width="0" />

    <!-- Pillar Base -->
    <rect x="23" y="48" width="18" height="4" rx="2" stroke-width="0" />
    <rect x="20" y="52" width="24" height="3" rx="1.5" stroke-width="0" />

    <!-- Balance Crossbeam (Central Pivot & Arms) -->
    <circle cx="32" cy="18" r="3.5" stroke-width="0" />
    <path d="M12 21.5 C20 18.5, 44 18.5, 52 21.5" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Left Plate Strings -->
    <line x1="12" y1="21.5" x2="6" y2="34" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="12" y1="21.5" x2="18" y2="34" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <!-- Left Plate / Pan -->
    <path d="M4 34 C4 40, 20 40, 20 34 Z" fill="url(#goldGrad)" stroke-width="0" />

    <!-- Right Plate Strings -->
    <line x1="52" y1="21.5" x2="46" y2="34" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="52" y1="21.5" x2="58" y2="34" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <!-- Right Plate / Pan -->
    <path d="M44 34 C44 40, 60 40, 60 34 Z" fill="url(#goldGrad)" stroke-width="0" />
  </g>
</svg>